<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Beispiel</title>
  </head>

  <body>
    <h1>Hallo Chat!</h1>

    <h2>Add message</h2>
    <form action="/api/add" method="post">
      <input type="text" name="name" placeholder="Name eingeben" />
      <input type="text" name="message" placeholder="Nachricht eingeben" />
      <input type="submit" value="Absenden" />
    </form>
    <br />
    <br />
    <h2>Delete messages</h2>
    <form action="/api/delete" method="post">
      <input type="text" name="id" placeholder="ID eingeben" />
      <input type="submit" value="Absenden" />
    </form>
  </body>
</html>
